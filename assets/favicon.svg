<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="mark-title">
  <title id="mark-title">Al-Madinah International College of Arabic and Qur'anic Studies</title>
  <!-- Governing circle: diameter 7n (al-khatt al-mansub, Ibn Muqla's third measurement) -->
  <circle cx="40" cy="40" r="28" fill="none" stroke="currentColor" stroke-width="1.25" opacity=".55"/>
  <!-- Alif: 7n high, on the circle's axis. The standard by which all letters are measured. -->
  <path d="M36.6 12 h6.8 l-.9 56 h-5 Z" fill="currentColor"/>
  <!-- Baseline: the line of writing, extending 1n each side -->
  <path d="M28 68 h24" stroke="currentColor" stroke-width="1.25" fill="none" opacity=".55"/>
  <!-- Nuqta: 1n rhombus. Unit of proportion; guardian of recitation. -->
  <path d="M58 63 l5 5 -5 5 -5 -5 Z" fill="currentColor"/>
</svg>
