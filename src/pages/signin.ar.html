<section class="section"><div class="wrap u-col-sm">
  <span class="eyebrow">بوابة الحرم</span>
  <h1 class="h1">تسجيل الدخول</h1>
  <p class="lead">بوّابةٌ واحدة. الطلابُ والمعلّمون وأولياءُ الأمور والخرّيجون يدخلون جميعًا من
    هنا، وما تراه تحدّده علاقتُك بالكلية، لا نظامٌ منفصلٌ لكلّ صفة.</p>
  <form class="panel" method="post" action="/ar/signin/">
    <label class="field"><span>البريد الإلكتروني</span><input type="email" name="email" dir="ltr" autocomplete="email" required></label>
    <label class="field"><span>كلمة المرور</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn--primary" type="button" disabled aria-disabled="true" class="u-full">الدخول — غير مُفعَّل بعد</button>
    <p class="field__hint u-stack-4">نظامُ الدخول غيرُ موصولٍ بعد، وهذه الاستمارةُ
      تصرّح بذلك بدل أن تقبل بياناتٍ لا تصل إلى شيء.</p>
  </form>
  <div class="btn-row"><a class="btn btn--ghost" href="/ar/portal/">استعراض بنية البوّابة</a></div>
</div></section>
